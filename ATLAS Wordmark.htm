    <title>ATLAS Wordmark</title>
    <meta name="description" content="ATLAS wordmark generator">
	  <meta name="author" content="Clement Zheng">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html, body {
          font-family: Helvetica, sans-serif;
          color: #000;
          font-size: 10px;
          font-weight: 400;
          line-height: 1.0;
          overflow-x: hidden;
          background: white;
      }

      body.dark {
        color: white;
        background: black;
      }

      div#container {
          position: relative;
          float: left;
          padding: 0;
          margin: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-basis: 100%;
          flex-wrap: wrap;
      }

      div#wordmark-div {
          width: 70vw;
      }

      div#wordmark-svg-div {
          position: relative;
          float: left;
          width: 100%;
      }

      div#wordmark-svg-div svg {
          position: relative;
          float: left;
          width: 100%;
      }
      
      div.wordmark-ui-div {
          position: relative;
          float: left;
          width: 100%;
          margin: 5em 0;
      }

      div.wordmark-ui-div .ui-block {
          position: absolute;
          width: 100%;
      }

      div.wordmark-ui-div .ui-block span {
          position: relative;
          float: left;
          width: 33%;
          cursor: pointer;
          user-select: none;
          opacity: 0.5;
          text-align: center;
          text-decoration: none;
      }

      div.wordmark-ui-div .ui-block span#random-button {
          width: 50%;
      }
      div.wordmark-ui-div .ui-block span#dark-mode {
          width: 50%;
      }

      body.dark div.wordmark-ui-div .ui-block span#dark-mode {
          opacity: 0.8;
          text-decoration: underline;
      }

      div.wordmark-ui-div .ui-block .lock.active {
          opacity: 0.8;
          text-decoration: underline;
      }

      div.wordmark-ui-div .ui-block span:hover, div.wordmark-ui-div .ui-block .lock:hover {
          opacity: 1.0;
      }

      div.wordmark-ui-div .ui-block span.arrow {
          font-size: 20px;
          line-height: 0.4;
      }

      div.wordmark-ui-div #wordmark-ui-1 {
          left: 0;
          width: 24.1%;
      }

      div.wordmark-ui-div #wordmark-ui-2 {
          left: 57.6%;
          width: 24.1%;
      }

      div#download-div {
        position: relative;
        float: left;
        width: 100%;
        text-align: center;
        margin-top: 10em;
        user-select: none;
        display: flex;
        justify-content: center;
        align-items: top;
        flex-basis: 100%;
        flex-wrap: wrap;
      }

      div#download-div a {
        color: black;
        width: 100%;
        margin-bottom: 3em;
      }

      div#download-div div#wordmark-img {
        width: 20%;
        margin-bottom: 3em;
      }

      body.dark div#download-div a {
        color: white;
      }

      @media only screen 
      and (min-width: 800px)  {
        div#wordmark-div {
          width: 40vw;
        }
      }

      @media only screen 
      and (min-width: 1400px)  {
        div#download-div {
          justify-content: center;
        }      

        div#download-div a {
          width: initial;
          margin-right: 6em;
        }

        div#download-div div#wordmark-img {
          margin-right: 6em;
        }
      }

      #all-wordmarks {
        position: fixed;
        right: 5em;
        top: 0;
        width: 90vh;
        height: 20vw;
        transform: rotate(-90deg);
        transform-origin: right top;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.1em;
        z-index: 100;
      }

      #all-wordmarks span a {
        text-transform: uppercase;
        opacity: 0.5;
        cursor: pointer;
        text-decoration: none;
        color:black;
      }

      #all-wordmarks span a em {
        font-size: 1.8em;
        line-height: 1.5;
      }

      body.dark #all-wordmarks span a {
        color:white;
      }

      #all-wordmarks span a:hover {
        opacity: 1.0;
      }


    </style>
